<%@ page import="java.util.List" %>
<%@ page import="Grade" %>
<%@ page import="Student" %>
<!DOCTYPE html>
<html>
<head>
    <title>Grades</title>
</head>
<body>
    <h1>Grades for ${student.getName()}</h1>
    <table border="1">
        <tr>
            <th>Course</th>
            <th>Credits</th>
            <th>Score</th>
        </tr>
        <c:forEach var="grade" items="${student.getGrades()}">
            <tr>
                <td>${grade.getCourse().getCourseName()}</td>
                <td>${grade.getCourse().getCredits()}</td>
                <td>${grade.getScore()}</td>
            </tr>
        </c:forEach>
    </table>
    <p>GPA: ${student.calculateGPA()}</p>
</body>
</html>
